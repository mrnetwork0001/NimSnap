# NimSnap - nginx vhost
#
# ADDITIVE ONLY. This is a new server block for one hostname. It does not touch
# the default site or any existing vhost.
#
# Install:
#   sudo cp deploy/nginx-nimsnap.conf /etc/nginx/sites-available/nimsnap
#   sudo ln -s /etc/nginx/sites-available/nimsnap /etc/nginx/sites-enabled/nimsnap
#   sudo nginx -t                 # MUST pass before the next line
#   sudo systemctl reload nginx   # reload, never restart - existing connections survive
#
# Then add TLS without editing this file by hand:
#   sudo certbot --nginx -d nimsnap.xyz -d www.nimsnap.xyz

server {
    listen 80;
    listen [::]:80;
    server_name nimsnap.xyz www.nimsnap.xyz;

    # Uploads are base64 data URIs of phone photos; the default 1m would reject them.
    client_max_body_size 20m;

    # A generation can legitimately take the best part of a minute.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The app rate-limits per client, so it needs the real address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Stored results are immutable and named with random keys.
    location /results/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
